# Builds the Android app on every change. When VERSION holds a new number, it also
# publishes a signed APK as a GitHub Release, ready to install on your phone.
#
# GitHub secrets used (see README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD  - the app's signing key
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        run: |
          set -euo pipefail
          NAME=$(tr -d '[:space:]' < VERSION)
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if git ls-remote --exit-code --tags origin "refs/tags/v$NAME" > /dev/null; then NEW=false; else NEW=true; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (build $CODE), new release: $NEW"

      - name: Load signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/portfolio.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/portfolio.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret yet: building a test-only copy, nothing will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          TASK=assembleRelease
          [ "${{ steps.key.outputs.signed }}" = "true" ] || TASK=assembleDebug
          ./gradlew testDebugUnitTest "$TASK" --no-daemon -PappVersionCode=${{ steps.version.outputs.code }} -PappVersionName=${{ steps.version.outputs.name }}
          mkdir -p ../out
          if [ "$TASK" = assembleRelease ]; then
            cp app/build/outputs/apk/release/app-release.apk "../out/portfolio-${{ steps.version.outputs.name }}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "../out/portfolio-${{ steps.version.outputs.name }}-test.apk"
          fi
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-apk-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.key.outputs.signed == 'true' && steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" "out/portfolio-${{ steps.version.outputs.name }}.apk" \
            --target "$GITHUB_SHA" --title "Portfolio ${{ steps.version.outputs.name }}" \
            --notes "$(git log -1 --pretty=%s)"
